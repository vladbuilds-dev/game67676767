<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Университет «Ремесло» — 67</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#000;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;font-family:monospace;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    touch-action:none;-webkit-user-select:none;user-select:none;
    box-shadow:0 0 60px rgba(232,178,58,.25);}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
(() => {
"use strict";

/* ================= SETUP ================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 960, H = 540;
let T = 0;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

function resize(){
  const mW = window.innerWidth, mH = window.innerHeight;
  const ratio = W / H;
  let cw = mW, ch = mW / ratio;
  if(ch > mH){ ch = mH; cw = mH * ratio; }
  cv.style.width = Math.floor(cw) + 'px';
  cv.style.height = Math.floor(ch) + 'px';
}
resize();
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 100));

/* ================= WORLD ================= */
// Чёткие пиксель-цифры 6 и 7
const FONT_6 = [
  "001110",
  "011000",
  "110000",
  "111100",
  "110011",
  "110011",
  "011110"
];
const FONT_7 = [
  "111111",
  "111111",
  "000011",
  "000011",
  "000110",
  "001100",
  "011000"
];

// Внутренний дворик в нижней петле «6» (пустые клетки шрифта)
const COURTYARD_6 = [[4,2],[4,3],[5,2],[5,3]];

const SCALE  = 6;
const CELL   = 40;

const DIGIT_W = 6 * SCALE;   // 36
const DIGIT_H = 7 * SCALE;   // 42
const GAP     = 16;          // улица
const L_STRIP = 3;
const T_STRIP = 6;
const B_STRIP = 6;

const OFFSET_6 = { c: L_STRIP,                  r: T_STRIP };
const OFFSET_7 = { c: L_STRIP + DIGIT_W + GAP,  r: T_STRIP };

const GRID_W = L_STRIP + DIGIT_W + GAP + DIGIT_W + L_STRIP;
const GRID_H = T_STRIP + DIGIT_H + B_STRIP;
const WW = GRID_W * CELL;
const WH = GRID_H * CELL;

const walkable  = [];
const courtyard = [];
for(let r=0;r<GRID_H;r++){
  walkable.push(new Array(GRID_W).fill(false));
  courtyard.push(new Array(GRID_W).fill(false));
}

function stampDigit(font, off, courts){
  for(let fr=0;fr<font.length;fr++){
    for(let fc=0;fc<font[fr].length;fc++){
      const isWalk  = font[fr][fc] === '1';
      const isCourt = courts.some(([r,c])=> r===fr && c===fc);
      if(!isWalk && !isCourt) continue;
      for(let dr=0;dr<SCALE;dr++) for(let dc=0;dc<SCALE;dc++){
        const r = off.r + fr*SCALE + dr;
        const c = off.c + fc*SCALE + dc;
        if(r<0||r>=GRID_H||c<0||c>=GRID_W) continue;
        walkable[r][c] = true;
        if(isCourt) courtyard[r][c] = true;
      }
    }
  }
}
stampDigit(FONT_6, OFFSET_6, COURTYARD_6);
stampDigit(FONT_7, OFFSET_7, []);

// Улица вокруг и между
const GAP_C1 = L_STRIP + DIGIT_W;               // первый столбец улицы
const GAP_C2 = L_STRIP + DIGIT_W + GAP - 1;     // последний столбец улицы
for(let r=0;r<GRID_H;r++){
  for(let c=0;c<GRID_W;c++){
    if(walkable[r][c]) continue;
    const inLeft   = c < L_STRIP;
    const inRight  = c >= GRID_W - L_STRIP;
    const inTop    = r < T_STRIP;
    const inBottom = r >= GRID_H - B_STRIP;
    const inGap    = c >= GAP_C1 && c <= GAP_C2;
    if(inLeft || inRight || inTop || inBottom || inGap){
      walkable[r][c] = true;
    }
  }
}

/* ================= КОЛЛИЗИЯ ================= */
const KAZAN = { x: 21*CELL + 20, y: 36*CELL + 20, r: 90 };   // во дворике «6»

const standPositions = [
  { x: 12*CELL + 20, y: 42*CELL }, { x: 12*CELL + 20, y: 46*CELL },
  { x: 30*CELL + 20, y: 42*CELL }, { x: 30*CELL + 20, y: 46*CELL }
];

function inWalkGrid(x, y){
  const c = Math.floor(x/CELL), r = Math.floor(y/CELL);
  if(r<0||r>=GRID_H||c<0||c>=GRID_W) return false;
  return walkable[r][c];
}
function boxFree(x, y){
  const hw = 7, hh = 6;
  if(!inWalkGrid(x-hw, y-hh)) return false;
  if(!inWalkGrid(x+hw, y-hh)) return false;
  if(!inWalkGrid(x-hw, y+hh)) return false;
  if(!inWalkGrid(x+hw, y+hh)) return false;
  if(Math.hypot(x-KAZAN.x, y-KAZAN.y) < KAZAN.r + 8) return false;
  for(const s of standPositions){
    if(Math.hypot(x-s.x, y-s.y) < 26 + 8) return false;
  }
  return true;
}

/* ================= PICKUPS ================= */
let seed = 67*6767;
function rnd(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; }

function randomWalkPoint(minDist, existing){
  for(let i=0;i<900;i++){
    const c = Math.floor(rnd()*GRID_W);
    const r = Math.floor(rnd()*GRID_H);
    if(!walkable[r][c]) continue;
    const x = c*CELL + CELL/2, y = r*CELL + CELL/2;
    if(Math.hypot(x-KAZAN.x, y-KAZAN.y) < KAZAN.r + 40) continue;
    let ok = true;
    for(const e of existing){
      if(Math.hypot(e.x-x, e.y-y) < minDist){ ok = false; break; }
    }
    if(ok) return { x, y };
  }
  return null;
}

const diamonds = [];
for(let i=0;i<67;i++){
  const p = randomWalkPoint(60, diamonds);
  if(p) diamonds.push({ x:p.x, y:p.y, taken:false, ph: rnd()*6.283 });
}
const churchelas = [];
for(let i=0;i<24;i++){
  const p = randomWalkPoint(70, churchelas.concat(diamonds));
  if(p) churchelas.push({ x:p.x, y:p.y, taken:false, ph: rnd()*6.283 });
}

/* ================= NPC ================= */
const npcs = [
  { id:'rector', name:'РЕКТОР МИХАИЛ ЛИТВИН',
    x: 15*CELL + 20, y: 15*CELL + 20, c:{
      skin:'#f0c090', robe:'#243b55', belt:'#e8b23a', pants:'#1a2634',
      hat:'hair', hair:'#3a3a3a', glasses:true },
    lines:[
      'Добро пожаловать в «Ремесло», студент!',
      'Мы внутри цифры «6». Второй корпус — цифра «7», через улицу.',
      'Экзамен КАЖДЫЙ день. Каждому — Мини Купер.',
      'Собери 67 алмазов — и экзамен твой.'
    ]},
  { id:'ronaldo', name:'ФИЗРА — РОНАЛДО',
    x: 6*CELL + 20, y: 33*CELL + 20, c:{
      skin:'#d9a06a', robe:'#f2f2f2', belt:'#2e86c1', pants:'#1a1a22',
      hat:'band', hair:'#2b1b12' },
    lines:[
      'СИУУУ! Я — учитель физры.',
      'Бегаем 67 кругов по букве «6», потом по «7».',
      'Кто не сдаст — чистит тандыр. Оба.',
      'Через улицу бегом, марш!'
    ]},
  { id:'smile', name:'ЛИТЕРАТУРА — МИСТЕР СМАЙЛ',
    x: 75*CELL + 20, y: 12*CELL + 20, c:{
      skin:'#ffe066', robe:'#7d3c98', belt:'#e8b23a', pants:'#2c1a3a',
      hat:'top', hair:'#111' },
    lines:[
      'Привет-привет! Улыбнись! :)',
      'Добро пожаловать в корпус «7» — ПМИ!',
      'Сочинение: «Образ плова в архитектуре 67».',
      'Не менее 67 страниц!'
    ]},
  { id:'beast', name:'МИСТЕР БИСТ — СТЕКЛОВАТА',
    x: 84*CELL + 20, y: 24*CELL + 20, c:{
      skin:'#e0a878', robe:'#1f6feb', belt:'#0d47a1', pants:'#161616',
      hat:'cap', hair:'#111' },
    lines:[
      'Я отвечаю за стекловату и шоколад.',
      'Стекловатой утеплил «6» и «7». И улицу между ними.',
      'У меня всё в шоколаде. АБСОЛЮТНО всё.',
      'Даже стены формы «67» — в шоколаде.'
    ]},
  { id:'brym', name:'БРЫМДЫЩ — ГЛАВНЫЙ БОСС',
    x: 66*CELL + 20, y: 45*CELL + 20, c:{
      skin:'#c98a4b', robe:'#6c3483', belt:'#e8b23a', pants:'#241432',
      hat:'crown', hair:'#111', big:true },
    lines:[]},
  { id:'t1', name:'УЧИТЕЛЬНИЦА',
    x: 21*CELL + 20, y: 21*CELL + 20, c:{
      skin:'#f5cba7', robe:'#ff6fa5', belt:'#e8b23a', pants:'#3a1f2e',
      hat:'hair', hair:'#4b2e1e' },
    lines:[
      'Приветик! Мы во дворике цифры «6»!',
      'У меня 67 браслетов ручной работы. Все красивые!',
      'Казан прямо тут, рядом — беги смотреть!'
    ]},
  { id:'t2', name:'УЧИТЕЛЬНИЦА',
    x: 12*CELL + 20, y: 27*CELL + 20, c:{
      skin:'#f5cba7', robe:'#9b59b6', belt:'#e8b23a', pants:'#2c1a3a',
      hat:'hair', hair:'#e8b23a' },
    lines:[
      'Ой, новенький! Держи чурчхелу, она полезная.',
      'Второй корпус — через улицу. Иди прямо и увидишь «7».',
      'Шучу. Всегда 67.'
    ]},
  { id:'t3', name:'УЧИТЕЛЬНИЦА',
    x: 20*CELL + 20, y: 45*CELL + 20, c:{
      skin:'#f5cba7', robe:'#1abc9c', belt:'#e8b23a', pants:'#143a34',
      hat:'hair', hair:'#2b1b12' },
    lines:[
      'Мой любимый браслет — 67-й в коллекции!',
      'Улица между корпусами — самая красивая.',
      'Алмазы блестят ярче, если собрать все 67.'
    ]},
  { id:'t4', name:'УЧИТЕЛЬНИЦА',
    x: 78*CELL + 20, y: 30*CELL + 20, c:{
      skin:'#f5cba7', robe:'#e74c3c', belt:'#e8b23a', pants:'#3a1a1a',
      hat:'hair', hair:'#111' },
    lines:[
      'Держи алмазик! Шучу, не держу. Ищи сам.',
      'Спускайся по диагонали «7» вниз — там Брымдыщ.',
      'Плов в казане — главный экспонат.'
    ]}
];

/* ================= CARS / EXAM ================= */
const cars = [
  { x: 70*CELL + 20, y: 51*CELL + 20, color:'#c0392b' },
  { x: 88*CELL + 20, y: 51*CELL + 20, color:'#2e86c1' }
];
const EXAM = { x: 24*CELL + 20, y: 8*CELL + 20 };

/* ================= STATE ================= */
const player = { x: 20*CELL + 20, y: 15*CELL + 20, speed: 4.4, anim: 0, dir: 1 };
const cam = { x: 0, y: 0 };
let state = 'intro';
let dlg = null;
let gotD = 0, gotC = 0;
let hasKey = false;

/* ================= QUIZ ================= */
const quizBase = [
  { q:'67 + 0 = ?', a:['67','76','670'], c:0 },
  { q:'Какую форму имеют корпуса?', a:['Цифры 6 и 7','Квадрат','Круг'], c:0 },
  { q:'Что получает студент каждый день?', a:['Мини Купер','Кирпич','Ничего'], c:0 },
  { q:'Кто отвечает за стекловату и шоколад?', a:['Мистер Бист','Роналдо','Мистер Смайл'], c:0 },
  { q:'Что варят в казане во дворе «6»?', a:['Плов','Стекловату','Бриллианты'], c:0 }
];
let quiz = [], qIndex = 0, qCorrect = 0, quizMsg = null, quizMsgT = 0;

function startQuiz(){
  quiz = quizBase.map(it=>{
    const idx = it.a.map((t,i)=>({t,i}));
    for(let i=idx.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [idx[i],idx[j]] = [idx[j],idx[i]];
    }
    return { q:it.q, a:idx.map(o=>o.t), c:idx.findIndex(o=>o.i===it.c) };
  });
  qIndex = 0; qCorrect = 0; quizMsg = null; quizMsgT = 0;
  state = 'quiz';
}
function answerQuiz(p){
  if(quizMsg) return;
  const ok = p === quiz[qIndex].c;
  if(ok) qCorrect++;
  quizMsg = { ok, text: ok ? 'ВЕРНО! +67 очков уважения' : 'НЕВЕРНО... но экзамен всё равно каждый день' };
  quizMsgT = 0.9;
}
function nextQuestion(){
  quizMsg = null; qIndex++;
  if(qIndex >= quiz.length){
    if(qCorrect >= 4){
      hasKey = true;
      cars.push({ x: Math.round(player.x)+90, y: Math.round(player.y)+30, color:'#e8b23a' });
      startDialogue({ name:'ЭКЗАМЕН СДАН!', lines:[
        'Ты сдал экзамен! (' + qCorrect + '/5)',
        'Держи ключи от Мини Купера!',
        'Теперь найди БРЫМДЫЩА — внизу цифры «7».'
      ]});
    } else {
      startDialogue({ name:'ЭКЗАМЕН ПРОВАЛЕН', lines:[
        'Правильных: ' + qCorrect + '/5. Нужно минимум 4.',
        'Экзамен будет ЗАВТРА. И послезавтра.',
        'Подойди к столу и попробуй снова.'
      ]});
    }
  }
}

/* ================= DIALOGUE ================= */
function startDialogue(npc){
  dlg = { name:npc.name, lines:npc.lines.slice(), i:0, onEnd:npc.onEnd||null };
  state = 'dialogue';
}
function advanceDialogue(){
  if(!dlg) return;
  dlg.i++;
  if(dlg.i >= dlg.lines.length){
    const cb = dlg.onEnd;
    dlg = null; state = 'play';
    if(cb) cb();
  }
}

/* ================= INTERACT ================= */
function interact(){
  let best = null, bd = 1e9;
  for(const n of npcs){
    const d = Math.hypot(n.x-player.x, n.y-player.y);
    if(d < 95 && d < bd){ bd = d; best = n; }
  }
  if(best){
    if(best.id === 'brym'){
      if(!hasKey){
        startDialogue({ name:best.name, lines:[
          'Я — БРЫМДЫЩ! Я привожу студентов!',
          'Мне нужно: 67 алмазов и сданный экзамен.',
          'У тебя алмазов: ' + gotD + '. Экзамен: ' + (hasKey?'сдан':'не сдан') + '.',
          'Работай, студент. Я жду.'
        ]});
      } else {
        startDialogue({ name:best.name, lines:[
          'АЛМАЗЫ: ' + gotD + '/67. ЭКЗАМЕН: СДАН. КУПЕР: ЕСТЬ.',
          'БРЫМДЫЩ ДОВОЛЕН.',
          'Я привёл 67 студентов в «6». И 67 — в «7».',
          'Добро пожаловать в Университет Мечты «РЕМЕСЛО»!'
        ], onEnd: ()=>{ state = 'win'; } });
      }
      return;
    }
    startDialogue({ name:best.name, lines:best.lines });
    return;
  }
  if(Math.hypot(EXAM.x-player.x, EXAM.y-player.y) < 130){
    if(hasKey){
      startDialogue({ name:'ЭКЗАМЕН 67', lines:['Ты уже сдал сегодня. Приходи завтра. И послезавтра. И...'] });
    } else if(gotD < 67){
      startDialogue({ name:'ЭКЗАМЕН 67', lines:[
        'Экзамен каждый день, студент!',
        'Но сначала собери 67 алмазов. У тебя: ' + gotD + '/67.',
        'И чурчхелы возьми, у тебя ' + gotC + '.'
      ]});
    } else {
      startQuiz();
    }
  }
}

/* ================= UPDATE ================= */
const keys = {};
function update(dt){
  T += dt/60;
  if(quizMsgT > 0){ quizMsgT -= dt/60; if(quizMsgT <= 0) nextQuestion(); }
  if(state !== 'play') return;

  let dx = 0, dy = 0;
  if(keys['KeyA']||keys['ArrowLeft'])  dx -= 1;
  if(keys['KeyD']||keys['ArrowRight']) dx += 1;
  if(keys['KeyW']||keys['ArrowUp'])    dy -= 1;
  if(keys['KeyS']||keys['ArrowDown'])  dy += 1;
  if(touchJoy.active){
    dx = touchJoy.dx; dy = touchJoy.dy;
    if(Math.hypot(dx,dy) < 0.15){ dx = 0; dy = 0; }
  }
  if(dx && dy && (keys['KeyA']||keys['KeyD']||keys['KeyW']||keys['KeyS'])){
    dx *= 0.7071; dy *= 0.7071;
  }

  const sp = player.speed * dt;
  if(dx){
    const nx = player.x + dx*sp;
    if(boxFree(nx, player.y)) player.x = nx;
    if(Math.abs(dx) > 0.1) player.dir = dx > 0 ? 1 : -1;
  }
  if(dy){
    const ny = player.y + dy*sp;
    if(boxFree(player.x, ny)) player.y = ny;
  }
  if(dx||dy) player.anim += dt*0.22;

  cam.x = clamp(player.x - W/2, 0, WW - W);
  cam.y = clamp(player.y - H/2, 0, WH - H);

  for(const d of diamonds){
    if(!d.taken && Math.hypot(d.x-player.x, d.y-(player.y-8)) < 28){ d.taken = true; gotD++; }
  }
  for(const ch of churchelas){
    if(!ch.taken && Math.hypot(ch.x-player.x, ch.y-(player.y-8)) < 28){ ch.taken = true; gotC++; }
  }
}

/* ================= INPUT ================= */
addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]) onPress(e.code);
  keys[e.code] = true;
});
addEventListener('keyup', e=>{ keys[e.code] = false; });

function onPress(code){
  if(state === 'intro'){ if(code==='Space'||code==='Enter') state='play'; return; }
  if(state === 'dialogue'){ if(code==='KeyE'||code==='Space'||code==='Enter') advanceDialogue(); return; }
  if(state === 'quiz'){
    if(quizMsg) return;
    if(code==='Digit1'||code==='Numpad1') answerQuiz(0);
    if(code==='Digit2'||code==='Numpad2') answerQuiz(1);
    if(code==='Digit3'||code==='Numpad3') answerQuiz(2);
    return;
  }
  if(state === 'win'){ if(code==='KeyR') location.reload(); return; }
  if(state === 'play'){ if(code === 'KeyE') interact(); }
}

/* ================= TOUCH ================= */
const touchJoy = { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0 };
const touchBtn = { active:false, id:null };

function tToC(t){
  const rect = cv.getBoundingClientRect();
  return { x:(t.clientX-rect.left)*(W/rect.width), y:(t.clientY-rect.top)*(H/rect.height) };
}
cv.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p = tToC(t);
    if(state === 'intro'){ onPress('Space'); continue; }
    if(state === 'dialogue'){ onPress('Space'); continue; }
    if(state === 'win'){ onPress('KeyR'); continue; }
    if(state === 'quiz'){
      if(quizMsg) continue;
      for(let i=0;i<3;i++){
        const bx = W/2 - 320, by = 195 + i*76;
        if(p.x >= bx && p.x <= bx+640 && p.y >= by && p.y <= by+58){
          onPress('Digit'+(i+1)); break;
        }
      }
      continue;
    }
    if(state === 'play'){
      if(p.x < W/2 && p.y > H-260){
        if(!touchJoy.active){
          touchJoy.active = true; touchJoy.id = t.identifier;
          touchJoy.baseX = p.x; touchJoy.baseY = p.y;
          touchJoy.dx = 0; touchJoy.dy = 0;
        }
        continue;
      }
      if(p.x > W-260 && p.y > H-260){
        if(!touchBtn.active){
          touchBtn.active = true; touchBtn.id = t.identifier;
          onPress('KeyE');
        }
        continue;
      }
    }
  }
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === touchJoy.id && touchJoy.active){
      const p = tToC(t);
      let dx = p.x - touchJoy.baseX, dy = p.y - touchJoy.baseY;
      const d = Math.hypot(dx, dy), maxD = 55;
      if(d > maxD){ dx *= maxD/d; dy *= maxD/d; }
      touchJoy.dx = dx / maxD; touchJoy.dy = dy / maxD;
    }
  }
}, {passive:false});
function endTouch(e){
  for(const t of e.changedTouches){
    if(t.identifier === touchJoy.id){ touchJoy.active=false; touchJoy.id=null; touchJoy.dx=0; touchJoy.dy=0; }
    if(t.identifier === touchBtn.id){ touchBtn.active=false; touchBtn.id=null; }
  }
}
cv.addEventListener('touchend', endTouch, {passive:false});

function drawDiamondShape(x,y,s,ph){
  const glow = 0.5 + 0.5*Math.sin(T*3 + ph);
  ctx.save();
  ctx.globalAlpha = 0.22 * glow;
  ctx.fillStyle = '#7ff0ff';
  ctx.beginPath(); ctx.arc(x,y,s*2.1,0,7); ctx.fill();
  ctx.restore();
  const g = ctx.createLinearGradient(x-s,y-s,x+s,y+s);
  g.addColorStop(0,'#eafcff'); g.addColorStop(0.5,'#5fd8f0'); g.addColorStop(1,'#1f8fb5');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x, y-s*1.25); ctx.lineTo(x+s, y-s*0.3);
  ctx.lineTo(x, y+s*1.25); ctx.lineTo(x-s, y-s*0.3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x-s, y-s*0.3); ctx.lineTo(x+s, y-s*0.3);
  ctx.moveTo(x, y-s*1.25);  ctx.lineTo(x, y+s*1.25);
  ctx.stroke();
}
function drawChurchelaItem(x,y,ph){
  const bob = Math.sin(T*2 + ph)*3; y += bob;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x, y+18, 10, 4, 0, 0, 7); ctx.fill();
  const beads = [[0,-15],[4,-9],[-3,-3],[3,3],[-2,9],[1,14]];
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 1.5;
  for(let i=0;i<beads.length-1;i++){
    ctx.beginPath();
    ctx.moveTo(x+beads[i][0], y+beads[i][1]);
    ctx.lineTo(x+beads[i+1][0], y+beads[i+1][1]);
    ctx.stroke();
  }
  for(let i=0;i<beads.length;i++){
    const b = beads[i];
    ctx.fillStyle = i%2 ? '#8a5a2b' : '#6d431d';
    ctx.beginPath(); ctx.arc(x+b[0], y+b[1], 4.2, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,160,0.55)';
    ctx.beginPath(); ctx.arc(x+b[0]-1.2, y+b[1]-1.2, 1.5, 0, 7); ctx.fill();
  }
}

/* ================= FLOOR TYPE ================= */
function floorTypeAt(r, c){
  if(courtyard[r][c]) return 'court6';
  if(r >= OFFSET_6.r && r < OFFSET_6.r + DIGIT_H &&
     c >= OFFSET_6.c && c < OFFSET_6.c + DIGIT_W) return 'b6';
  if(r >= OFFSET_7.r && r < OFFSET_7.r + DIGIT_H &&
     c >= OFFSET_7.c && c < OFFSET_7.c + DIGIT_W) return 'b7';
  return 'street';
}
function isWallCell(r, c){
  if(walkable[r][c]) return false;
  if(r > 0 && walkable[r-1][c]) return true;
  if(r < GRID_H-1 && walkable[r+1][c]) return true;
  if(c > 0 && walkable[r][c-1]) return true;
  if(c < GRID_W-1 && walkable[r][c+1]) return true;
  return false;
}

/* ================= WORLD RENDER ================= */
function drawWorld(){
  const c0 = Math.max(0, Math.floor(cam.x / CELL) - 1);
  const c1 = Math.min(GRID_W - 1, Math.ceil((cam.x + W) / CELL) + 1);
  const r0 = Math.max(0, Math.floor(cam.y / CELL) - 1);
  const r1 = Math.min(GRID_H - 1, Math.ceil((cam.y + H) / CELL) + 1);

  for(let r=r0;r<=r1;r++){
    for(let c=c0;c<=c1;c++){
      const x = c*CELL, y = r*CELL;
      const type = floorTypeAt(r, c);

      if(walkable[r][c]){
        // Пол
        let col;
        const alt = (r+c)%2 === 0;
        if(type === 'court6')      col = alt ? '#4a2a1a' : '#3f2314';
        else if(type === 'b6')     col = alt ? '#b85a22' : '#a14e1b';
        else if(type === 'b7')     col = alt ? '#255f7f' : '#1f506d';
        else                       col = alt ? '#3a3a44' : '#32323c';
        ctx.fillStyle = col;
        ctx.fillRect(x, y, CELL, CELL);

        // Узор
        if(type === 'b6' || type === 'court6'){
          ctx.fillStyle = 'rgba(232,178,58,0.12)';
        } else if(type === 'b7'){
          ctx.fillStyle = 'rgba(95,216,240,0.12)';
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.05)';
        }
        ctx.beginPath();
        ctx.moveTo(x+CELL/2, y+8);
        ctx.lineTo(x+CELL-8, y+CELL/2);
        ctx.lineTo(x+CELL/2, y+CELL-8);
        ctx.lineTo(x+8, y+CELL/2);
        ctx.closePath(); ctx.fill();

        // Уголки
        ctx.fillStyle = (type === 'b7') ? 'rgba(95,216,240,0.5)' : 'rgba(232,178,58,0.4)';
        ctx.fillRect(x+3, y+3, 2, 2);
        ctx.fillRect(x+CELL-5, y+3, 2, 2);
        ctx.fillRect(x+3, y+CELL-5, 2, 2);
        ctx.fillRect(x+CELL-5, y+CELL-5, 2, 2);
      } else if(isWallCell(r, c)){
        // Стена
        ctx.fillStyle = '#0a1a22';
        ctx.fillRect(x, y, CELL, CELL);

        // Кирпичная текстура
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        ctx.fillRect(x+2, y+CELL/2, CELL-4, 2);
        ctx.fillRect(x+CELL/2, y+2, 2, CELL/2-2);
        ctx.fillRect(x+CELL/4, y+CELL/2+2, 2, CELL/2-2);

        // Золотая кромка по сторонам, обращённым к полу
        const TT = 6;
        ctx.fillStyle = '#e8b23a';
        if(r > 0 && walkable[r-1][c]) ctx.fillRect(x, y, CELL, TT);
        if(r < GRID_H-1 && walkable[r+1][c]) ctx.fillRect(x, y+CELL-TT, CELL, TT);
        if(c > 0 && walkable[r][c-1]) ctx.fillRect(x, y, TT, CELL);
        if(c < GRID_W-1 && walkable[r][c+1]) ctx.fillRect(x+CELL-TT, y, TT, CELL);

        // Тёмный угол
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(x, y+CELL-3, CELL, 3);
      } else {
        // Внешняя пустота
        ctx.fillStyle = '#020a10';
        ctx.fillRect(x, y, CELL, CELL);
      }
    }
  }

  // Большая цифра «6» на полу внутри «6»
  ctx.textAlign = 'center';
  ctx.font = 'bold ' + (DIGIT_W * CELL * 0.55) + 'px monospace';
  ctx.fillStyle = 'rgba(232,178,58,0.10)';
  ctx.fillText('6',
    (OFFSET_6.c + DIGIT_W/2) * CELL,
    (OFFSET_6.r + DIGIT_H/2) * CELL + 30);
  ctx.fillStyle = 'rgba(95,216,240,0.10)';
  ctx.fillText('7',
    (OFFSET_7.c + DIGIT_W/2) * CELL,
    (OFFSET_7.r + DIGIT_H/2) * CELL + 30);
}

/* ================= KAZAN ================= */
const plovDots = [];
for(let i=0;i<150;i++){
  const a = rnd()*Math.PI*2, r = Math.sqrt(rnd());
  const rr = rnd();
  plovDots.push({
    x: Math.cos(a)*80*r, y: Math.sin(a)*24*r,
    c: rr < 0.45 ? '#d97b2a' : (rr < 0.7 ? '#8a4a1e' : '#f7e9b8')
  });
}
function drawKazan(){
  const cx = KAZAN.x, cy = KAZAN.y;

  g.addColorStop(0, 'rgba(255,160,60,0.22)');
  g.addColorStop(1, 'rgba(255,160,60,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, 200, 0, 7); ctx.fill();

  ctx.fillStyle = '#2b2b33';
  ctx.fillRect(cx-62, cy+46, 20, 30);
  ctx.fillRect(cx+42, cy+46, 20, 30);
  ctx.fillStyle = '#1a1a20';
  ctx.beginPath(); ctx.ellipse(cx, cy+78, 88, 13, 0, 0, 7); ctx.fill();

  ctx.fillStyle = '#17171c';
  ctx.beginPath();
  ctx.moveTo(cx-80, cy-36);
  ctx.quadraticCurveTo(cx-86, cy+44, cx-48, cy+62);
  ctx.lineTo(cx+48, cy+62);
  ctx.quadraticCurveTo(cx+86, cy+44, cx+80, cy-36);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(cx-62, cy-24, 7, 64);
  ctx.fillRect(cx+50, cy-24, 5, 56);

  ctx.fillStyle = '#e8b23a';
  ctx.beginPath(); ctx.ellipse(cx, cy-36, 82, 26, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#9c6f1f';
  ctx.beginPath(); ctx.ellipse(cx, cy-34, 75, 21, 0, 0, 7); ctx.fill();

  ctx.fillStyle = '#e8c470';
  ctx.beginPath(); ctx.ellipse(cx, cy-36, 71, 19, 0, 0, 7); ctx.fill();
  for(const d of plovDots){
    ctx.fillStyle = d.c;

  for(let i=0;i<12;i++){

    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(let i=0;i<6;i++){
    const a = -1.0 + i*0.4;
    const bx = cx + Math.cos(a)*84;
    const by = cy - 36 + Math.sin(a)*26;
    ctx.strokeStyle = '#5c3f22'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by+22); ctx.stroke();
    for(let j=0;j<4;j++){
      ctx.fillStyle = j%2 ? '#8a5a2b' : '#6d431d';
      ctx.beginPath(); ctx.arc(bx, by+6+j*5, 3.5, 0, 7); ctx.fill();
    }
  }
}

/* ================= MINIMAP ================= */
function drawMinimap(){
  const mw = 170, mh = 112;
  const mx = W - mw - 12, my = 12;
  ctx.fillStyle = 'rgba(4,20,27,0.9)';
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = '#e8b23a'; ctx.lineWidth = 2;
  ctx.strokeRect(mx, my, mw, mh);

  const sx = mw / GRID_W, sy = mh / GRID_H;
  for(let r=0;r<GRID_H;r++){
    for(let c=0;c<GRID_W;c++){
      if(!walkable[r][c]) continue;
      const t = floorTypeAt(r,c);
      if(t === 'b6')          ctx.fillStyle = '#c96a2b';
      else if(t === 'court6') ctx.fillStyle = '#e8b23a';
      else if(t === 'b7')     ctx.fillStyle = '#5fd8f0';
      else                    ctx.fillStyle = '#5a5a66';
      ctx.fillRect(mx + c*sx, my + r*sy, Math.max(1, sx), Math.max(1, sy));
    }
  }
  // Казан
  ctx.fillStyle = '#fff2a8';
  ctx.fillRect(mx + (KAZAN.x/WW)*mw - 2, my + (KAZAN.y/WH)*mh - 2, 4, 4);
  // NPC
  ctx.fillStyle = '#e74c3c';
  for(const n of npcs){
    ctx.fillRect(mx + (n.x/WW)*mw - 1, my + (n.y/WH)*mh - 1, 2, 2);
  }
  // Игрок
  const px = mx + (player.x/WW)*mw, py = my + (player.y/WH)*mh;
  ctx.fillStyle = '#4ade80';
  ctx.fillRect(px-2, py-2, 4, 4);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.strokeRect(px-2, py-2, 4, 4);
}

/* ================= UI ================= */
function wrapText(text, x, y, maxW, lh){
  const words = text.split(' ');
  let line = '', yy = y;
  for(const w of words){
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, yy); line = w; yy += lh;
    } else line = test;
  }
  ctx.fillText(line, x, yy);
}

function drawHUD(){
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(4,20,27,0.85)';
  ctx.fillRect(12, 12, 270, 76);
  ctx.strokeStyle = '#e8b23a'; ctx.lineWidth = 2;
  ctx.strokeRect(12, 12, 270, 76);
  ctx.font = 'bold 16px monospace';
  ctx.fillStyle = '#7ff0ff';
  ctx.fillText('АЛМАЗЫ:  ' + gotD + ' / 67', 26, 38);
  ctx.fillStyle = '#c98a4b';
  ctx.fillText('ЧУРЧХЕЛА: ' + gotC, 26, 60);
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = hasKey ? '#4ade80' : '#666';
  ctx.fillText(hasKey ? 'КУПЕР: ПОЛУЧЕН ✔' : 'КУПЕР: НЕ ПОЛУЧЕН', 26, 78);

  if(!isTouch){
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = 'rgba(232,178,58,0.75)';
    ctx.fillText('WASD — идти · E — говорить · Два корпуса в форме 6 и 7', W/2, H-14);
  }

  if(state === 'play'){
    let near = null;
    for(const n of npcs) if(Math.hypot(n.x-player.x, n.y-player.y) < 95) near = n;
    if(!near && Math.hypot(EXAM.x-player.x, EXAM.y-player.y) < 130) near = { name:'ЭКЗАМЕН' };
    if(near){
      ctx.font = 'bold 14px monospace';
      const txt = (isTouch ? 'НАЖМИ КНОПКУ E · ' : 'E — ') +
                  (near.name === 'ЭКЗАМЕН' ? 'сдать экзамен' : 'поговорить');
      const tw = ctx.measureText(txt).width;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(4,20,27,0.9)';
      ctx.fillRect(W/2 - tw/2 - 14, H-72, tw + 28, 28);
      ctx.strokeStyle = '#5fd8f0'; ctx.lineWidth = 2;
      ctx.strokeRect(W/2 - tw/2 - 14, H-72, tw + 28, 28);
      ctx.fillStyle = '#5fd8f0';
      ctx.fillText(txt, W/2, H-52);
    }
  }
}

function drawMobileControls(){
  if(!isTouch) return;
  if(state !== 'play') return;
  ctx.fillStyle = 'rgba(232,178,58,0.10)';
  ctx.beginPath(); ctx.arc(110, H-110, 68, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(232,178,58,0.65)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(110, H-110, 68, 0, 7); ctx.stroke();
  const kx = 110 + (touchJoy.active ? touchJoy.dx*55 : 0);
  const ky = H-110 + (touchJoy.active ? touchJoy.dy*55 : 0);
  ctx.fillStyle = 'rgba(232,178,58,0.45)';
  ctx.beginPath(); ctx.arc(kx, ky, 26, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(232,178,58,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(kx, ky, 26, 0, 7); ctx.stroke();
  ctx.fillStyle = touchBtn.active ? 'rgba(95,216,240,0.35)' : 'rgba(95,216,240,0.15)';
  ctx.beginPath(); ctx.arc(W-110, H-110, 52, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(95,216,240,0.75)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(W-110, H-110, 52, 0, 7); ctx.stroke();
  ctx.fillStyle = '#5fd8f0'; ctx.font = 'bold 26px monospace';
  ctx.textAlign = 'center'; ctx.fillText('E', W-110, H-100);
}

function drawIntro(){
  ctx.fillStyle = 'rgba(2,10,16,0.9)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#e8b23a'; ctx.lineWidth = 4;
  ctx.strokeRect(30, 24, W-60, H-48);
  ctx.strokeStyle = '#5fd8f0'; ctx.lineWidth = 1;
  ctx.strokeRect(40, 34, W-80, H-68);

  ctx.font = 'bold 30px monospace'; ctx.fillStyle = '#e8b23a';
  ctx.fillText('УНИВЕРСИТЕТ', W/2, 68);
  ctx.font = 'bold 46px monospace'; ctx.fillStyle = '#5fd8f0';
  ctx.fillText('«РЕМЕСЛО»', W/2, 112);
  ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#c98a4b';
  ctx.fillText('г. САМАРКАНД · ДВА КОРПУСА В ФОРМЕ ЦИФР 6 И 7', W/2, 138);

  // Превью: две цифры
  const pw = W - 100, ph = 220;
  const px0 = 50, py0 = 155;
  const s = Math.min(pw / GRID_W, ph / GRID_H);
  const ox = px0 + (pw - GRID_W*s)/2;
  const oy = py0 + (ph - GRID_H*s)/2;
  ctx.fillStyle = '#031015';
  ctx.fillRect(px0, py0, pw, ph);
  for(let r=0;r<GRID_H;r++){
    for(let c=0;c<GRID_W;c++){
      if(!walkable[r][c]) continue;
      const t = floorTypeAt(r,c);
      if(t === 'b6')          ctx.fillStyle = '#c96a2b';
      else if(t === 'court6') ctx.fillStyle = '#e8b23a';
      else if(t === 'b7')     ctx.fillStyle = '#5fd8f0';
      else                    ctx.fillStyle = '#3a3a44';
      ctx.fillRect(ox + c*s, oy + r*s, Math.max(1, s), Math.max(1, s));
    }
  }
  ctx.strokeStyle = 'rgba(232,178,58,0.5)'; ctx.lineWidth = 2;
  ctx.strokeRect(px0, py0, pw, ph);

  ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#7ff0ff';
  ctx.textAlign = 'left';
  ctx.fillText('• КОРПУС «6» — ТАНДЫР, КУЛИНАРИЯ, КАЗАН, ДВОРИК', 40, 408);
  ctx.fillText('• КОРПУС «7» — ПМИ, БРЫМДЫЩ, СТЕКЛОВАТА', 40, 430);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#c98a4b';
  ctx.fillText('• УЛИЦА МЕЖДУ КОРПУСАМИ — ХОДИ СВОБОДНО', W-40, 408);
  ctx.fillText('• ВНУТРИ КАЖДОЙ ЦИФРЫ ЕСТЬ ПРОХОДЫ', W-40, 430);

  const blink = Math.sin(T*4) > 0;
  if(blink){
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#5fd8f0';
    ctx.fillText(isTouch ? 'КОСНИСЬ ЭКРАНА ЧТОБЫ НАЧАТЬ' : 'НАЖМИ [ПРОБЕЛ] ЧТОБЫ НАЧАТЬ', W/2, 490);
  }
}

function drawDialogue(){
  if(!dlg) return;
  ctx.fillStyle = 'rgba(4,20,27,0.94)';
  ctx.fillRect(50, H-180, W-100, 150);
  ctx.strokeStyle = '#e8b23a'; ctx.lineWidth = 3;
  ctx.strokeRect(50, H-180, W-100, 150);
  ctx.strokeStyle = '#5fd8f0'; ctx.lineWidth = 1;
  ctx.strokeRect(58, H-172, W-116, 134);
  ctx.textAlign = 'left';
  ctx.font = 'bold 20px monospace'; ctx.fillStyle = '#e8b23a';
  ctx.fillText(dlg.name, 78, H-142);
  ctx.font = '17px monospace'; ctx.fillStyle = '#e8f6ff';
  wrapText(dlg.lines[dlg.i], 78, H-108, W-160, 26);
  ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#5fd8f0';
  ctx.textAlign = 'right';
  ctx.fillText(isTouch ? 'ТАП — далее  (' + (dlg.i+1) + '/' + dlg.lines.length + ')'
                       : 'E / ПРОБЕЛ — далее  (' + (dlg.i+1) + '/' + dlg.lines.length + ')',
               W-78, H-46);
}

function drawQuiz(){
  ctx.fillStyle = 'rgba(2,10,16,0.94)';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e8b23a'; ctx.lineWidth = 3;
  ctx.strokeRect(30, 20, W-60, H-40);
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px monospace'; ctx.fillStyle = '#e8b23a';
  ctx.fillText('ЭКЗАМЕН  ' + (qIndex+1) + ' / ' + quiz.length, W/2, 68);
  ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#c98a4b';
  ctx.fillText('ПРАВИЛЬНО: ' + qCorrect + '   (нужно минимум 4)', W/2, 90);
  ctx.font = 'bold 20px monospace'; ctx.fillStyle = '#e8f6ff';
  ctx.fillText(quiz[qIndex].q, W/2, 150);
  for(let i=0;i<3;i++){
    const bx = W/2 - 320, by = 195 + i*76;
    ctx.fillStyle = 'rgba(232,178,58,0.10)';
    ctx.fillRect(bx, by, 640, 58);
    ctx.strokeStyle = '#e8b23a'; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, 640, 58);
    ctx.textAlign = 'left';
    ctx.font = 'bold 19px monospace'; ctx.fillStyle = '#5fd8f0';
    ctx.fillText(String(i+1), bx + 20, by + 37);
    ctx.fillStyle = '#e8f6ff'; ctx.font = '18px monospace';
    ctx.fillText(quiz[qIndex].a[i], bx + 58, by + 37);
    ctx.textAlign = 'center';
  }
  if(quizMsg){
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = quizMsg.ok ? '#4ade80' : '#e74c3c';
    ctx.fillText(quizMsg.text, W/2, H-55);
  } else {
    ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#c98a4b';
    ctx.fillText(isTouch ? 'Коснись варианта ответа' : 'Нажми 1, 2 или 3', W/2, H-52);
  }
}

function drawWin(){
  ctx.fillStyle = 'rgba(2,10,16,0.92)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  for(let i=0;i<60;i++){
    const x = ((i*137 + T*40) % (W+40)) - 20;
    const y = ((i*211 + T*90) % (H+40)) - 20;
    ctx.fillStyle = ['#e8b23a','#5fd8f0','#e74c3c','#4ade80','#c98a4b'][i%5];
    ctx.fillRect(x, y, 5, 5);
  }
  ctx.strokeStyle = '#e8b23a'; ctx.lineWidth = 4;
  ctx.strokeRect(30, 22, W-60, H-44);
  ctx.font = 'bold 30px monospace'; ctx.fillStyle = '#e8b23a';
  ctx.fillText('ТЫ ПРИНЯТ В УНИВЕРСИТЕТ МЕЧТЫ!', W/2, 72);
  ctx.font = 'bold 22px monospace'; ctx.fillStyle = '#5fd8f0';
  ctx.fillText('«РЕМЕСЛО» · САМАРКАНД · КОРПУСА 6 И 7', W/2, 104);
  drawMiniCooper(W/2, 210, '#e8b23a', 0.95);
  ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#e8f6ff';
  ctx.fillText('Алмазов собрано: ' + gotD + ' / 67', W/2, 310);
  ctx.fillText('Чурчхелы съедено: ' + gotC, W/2, 336);
  ctx.fillText('Экзамен сдан: ДА (а завтра — снова!)', W/2, 362);
  ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#c98a4b';
  ctx.fillText('БРЫМДЫЩ привёл 67 студентов в «6». И 67 — в «7».', W/2, 400);
  ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#4ade80';
  ctx.fillText('ФОРМА ЗДАНИЯ: 6 И 7 · ТЫ ВЫПУСКНИК!', W/2, 440);
  const blink = Math.sin(T*4) > 0;
  if(blink){
    ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#5fd8f0';
    ctx.fillText(isTouch ? 'ТАП — НАЧАТЬ ЗАНОВО' : 'НАЖМИ [R] — НАЧАТЬ ЗАНОВО', W/2, 490);
  }
}

/* ================= RENDER ================= */
function render(){
  ctx.fillStyle = '#020a10';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  drawWorld();
  drawKazan();
  drawStands();
  drawExamDesk();
  drawPickups();
  drawEntities();
  ctx.restore();
  drawHUD();
  drawMinimap();
  drawMobileControls();
  if(state === 'intro')    drawIntro();
  if(state === 'dialogue') drawDialogue();
  if(state === 'quiz')     drawQuiz();
  if(state === 'win')      drawWin();
}

/* ================= LOOP ================= */
let last = 0;
function loop(ts){
  if(!last) last = ts;
  let dt = (ts - last) / 16.6667;
  last = ts;
  dt = clamp(dt, 0.1, 2.5);
  update(dt);
  render();
  requestAnimationFrame(loop);
}
cam.x = clamp(player.x - W/2, 0, WW - W);
cam.y = clamp(player.y - H/2, 0, WH - H);
requestAnimationFrame(loop);

})();
</script>
